name: Patch Page 3 categories

on:
  push:
    paths:
      - '.github/workflows/page3-category-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          original = s

          # 1) 파서: [정기보수] 정식 지원 + 기존 [정수] 호환
          pattern = re.compile(
              r"if\(t\.startsWith\('\[정수\]:'\)\)\{\s*"
              r"last=side==='outlook'\?'outlook_maintenance_commentary':'market_maintenance_commentary';\s*"
              r"out\[last\]=t\.slice\('\[정수\]:'.length\)\.trim\(\);\s*continue;\s*\}",
              re.S,
          )
          repl = """if(t.startsWith('[정기보수]:')||t.startsWith('[정수]:')){
      const maintenanceTag=t.startsWith('[정기보수]:')?'[정기보수]:':'[정수]:';
      last=side==='outlook'?'outlook_maintenance_commentary':'market_maintenance_commentary';
      out[last]=t.slice(maintenanceTag.length).trim();
      continue;
    }"""
          s, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit(f'parseItemBlock maintenance patch count={n}')

          # 2) 동적 렌더링
          s, n = re.subn(
              r"if\(marketMaintenance\)a\.push\(taggedRow\('\[정수\]',marketMaintenance,r\.item,'maintenance'\)\);",
              "if(r.item==='BPA')a.push(taggedRow('[정기보수]',marketMaintenance,r.item,'maintenance',true));",
              s, count=1,
          )
          if n != 1:
              raise SystemExit(f'market maintenance render patch count={n}')

          s, n = re.subn(
              r"if\(marketOverseas\)a\.push\(taggedRow\('\[역외\]',marketOverseas,r\.item,'overseas'\)\);",
              "if(r.item==='MMA')a.push(taggedRow('[역외]',marketOverseas,r.item,'overseas',true));",
              s, count=1,
          )
          if n != 1:
              raise SystemExit(f'market overseas render patch count={n}')

          # BPA 전망에서 정기보수 행은 제거
          s = re.sub(
              r"\s*if\(outlookMaintenance\)a\.push\(taggedRow\('\[정수\]',outlookMaintenance,r\.item,'maintenance'\)\);",
              '', s, count=1,
          )

          # [수급] 직후에 [감산]을 원료/수급과 동일 peer-category로 항상 표시
          supply_line = "if(r.supply_demand_commentary)a.push(taggedRow('[수급]',r.supply_demand_commentary,r.item,'supply'));"
          if supply_line not in s:
              raise SystemExit('supply render line not found')
          s = s.replace(
              supply_line,
              supply_line + "\n    if(r.item==='BPA')a.push(taggedRow('[감산]',outlookReduction,r.item,'reduction',true));",
              1,
          )
          s = re.sub(
              r"\s*if\(outlookReduction\)a\.push\(taggedRow\('\[감산\]',outlookReduction,r\.item,'reduction'\)\);",
              '', s, count=1,
          )

          # 3) 편집모드 저장: 신규 라벨/기존 라벨 모두 인식
          old = "const marketMaintenance=pick(market,'[정수]'),outlookMaintenance=pick(outlook,'[정수]'),marketOverseas=pick(market,'[역외]')"
          new = "const marketMaintenance=pick(market,'[정기보수]')||pick(market,'[정수]'),outlookMaintenance=pick(outlook,'[정기보수]')||pick(outlook,'[정수]'),marketOverseas=pick(market,'[역외]')"
          if old not in s:
              raise SystemExit('extractCurrentReports maintenance picker not found')
          s = s.replace(old, new, 1)

          # 4) 3페이지 기본 템플릿 정리
          p3_start = s.find('<!-- PAGE 3 -->')
          p3_end = s.find('</section>', p3_start)
          if p3_start < 0 or p3_end < 0:
              raise SystemExit('PAGE 3 block not found')
          p3 = s[p3_start:p3_end]

          # BPA 시황 첫 [정수] -> [정기보수]
          p3 = p3.replace('[정수]', '[정기보수]', 1)

          # BPA 전망에 남아있는 정기보수/정수 행 제거
          p3 = re.sub(
              r'<div class="rowline tagged peer-category"><span class="tag-label">\[(?:정수|정기보수)\]</span><span class="tag-content">.*?</span></div>',
              '', p3, count=1, flags=re.S,
          )

          # 기본 템플릿에 감산/역외가 없으면 추가
          if '[감산]' not in p3:
              bpa_pos = p3.find('<td class="item">BPA</td>')
              supply_pos = p3.find('<span class="tag-label">[수급]</span>', bpa_pos)
              if supply_pos < 0:
                  raise SystemExit('BPA [수급] row not found')
              row_end = p3.find('</div>', p3.find('</span>', p3.find('</span>', supply_pos)+1))
              row_end += len('</div>')
              p3 = p3[:row_end] + '<div class="rowline tagged peer-category"><span class="tag-label">[감산]</span><span class="tag-content"></span></div>' + p3[row_end:]

          mma_pos = p3.find('<td class="item">MMA</td>')
          if mma_pos >= 0 and '[역외]' not in p3[mma_pos:]:
              der_pos = p3.find('<span class="tag-label">[유도품]</span>', mma_pos)
              if der_pos < 0:
                  raise SystemExit('MMA [유도품] row not found')
              row_end = p3.find('</div>', p3.find('</span>', p3.find('</span>', der_pos)+1))
              row_end += len('</div>')
              p3 = p3[:row_end] + '<div class="rowline tagged peer-category"><span class="tag-label">[역외]</span><span class="tag-content"></span></div>' + p3[row_end:]

          s = s[:p3_start] + p3 + s[p3_end:]

          for check in ("[정기보수]", "taggedRow('[감산]'", "taggedRow('[역외]'", "pick(market,'[정기보수]')"):
              if check not in s:
                  raise SystemExit(f'validation failed: {check}')
          if s == original:
              raise SystemExit('no changes applied')

          path.write_text(s, encoding='utf-8')
          print('Page 3 category patch applied successfully')
          PY

      - name: Commit patched dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/page3-category-patch.yml
          git add -A
          git commit -m "Add BPA maintenance/reduction and MMA overseas categories"
          git push
