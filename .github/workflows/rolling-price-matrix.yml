name: Verify rolling price matrix rules

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract browser script and check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts:
              raise SystemExit('script block not found')
          Path('/tmp/index.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.js
