name: Update GAS URL and verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace GAS URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='https://script.google.com/macros/s/AKfycbzezSDIQCzEDmHGNfDOS0N4ZFqKSzw50mLdgdHhJhMrNtyF2_ve32Up7ef2MxnfNCvM/exec'
          new='https://script.google.com/macros/s/AKfycbwHjtcv0oQs8OHnBJaa_-38FDs5VschSWGdmb8bMWF_S9AA3f_dPn16wbmtjbmbr0MC/exec'
          if old not in s:
              raise SystemExit('Old GAS URL not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify new GAS is public and returns JSON
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbwHjtcv0oQs8OHnBJaa_-38FDs5VschSWGdmb8bMWF_S9AA3f_dPn16wbmtjbmbr0MC/exec?action=weeks'
          curl -fsSL "$URL" -o /tmp/weeks.json
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/weeks.json').read_text(encoding='utf-8')
          d=json.loads(t)
          if not d.get('success'):
              raise SystemExit('GAS returned success=false')
          print('weeks:', d.get('weeks'))
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Point dashboard to newly deployed public GAS web app"
          git push
