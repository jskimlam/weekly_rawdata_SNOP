name: Fix price matrix baseline from W35 board

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed W35 baseline data into DB
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, calendar
          GAS='https://script.google.com/macros/s/AKfycbwHjtcv0oQs8OHnBJaa_-38FDs5VschSWGdmb8bMWF_S9AA3f_dPn16wbmtjbmbr0MC/exec'
          TOKEN='RAWMAT_'+'bae8861aa98d4b95b2beb486af2442b9ae2d8fedb4924b2e9e8faf16b21deb25'
          base_items=['WTI','Naphtha','Ethylene','Propylene','PP','Benzene','SM','AN','BD','ABS','BPA','PC','MMA','PMMA']
          weekly={
            '2026-08-28':[83.40,827,1050,1100,1105,1016,1177.5,1545,1510,1490,1375,1950,1710,1625],
            '2026-08-21':[87.06,827,1070,1100,1105,1022,1191,1545,1500,1520,1355,1885,1690,1625],
            '2026-08-14':[82.40,781,965,1070,1090,960,1143,1540,1400,1520,1335,1885,1680,1625],
            '2026-08-07':[78.18,761,990,1050,1090,916,1082,1540,1310,1490,1335,1885,1680,1625],
          }
          monthly={
            '2026-08':[82.76,799,1019,1080,1098,979,1148,1543,1430,1505,1350,1901,1690,1625],
            '2026-07':[79.31,797,913,973,1027,920,1074,1520,1220,1506,1330,1857,1704,1625],
            '2026-06':[80.31,690,876,1019,1134,893,1070,1668,1340,1593,1438,2081,1845,1625],
            '2025-12':[57.73,546,745,743,756,663,820,1098,905,1176,1075,1558,1265,1916],
            '2025-08':[64.34,586,827,776,863,734,899,1115,1084,1283,1117,1515,1284,1842],
          }
          row_items=['WTI','WTI_MT','Naphtha','Ethylene','Propylene','PP','Benzene','SM','AN','BD','Cost','ABS','ABS Spread','BPA','PC','PC-BPA Spread','MMA','PMMA']
          stats={
            'year_avg_2026':[82.33,603,808,1003,1048,1061,940,1130,1476,1555,1281,1551,270,1400,1980,580,1772,1950],
            'year_avg_2025':[64.85,475,597,814,795,846,749,913,1168,1122,1008,1306,300,1158,1567,411,1402,1635],
            'year_high_2025':[77.88,571,683,900,870,900,920,1066,1310,1490,1189,1430,372,1245,1685,485,1625,1675],
            'year_low_2025':[56.66,415,531,730,710,750,647,789,1070,770,866,1170,221,1075,1505,360,1265,1760],
            'historical_high':[145.29,1065,1246,1655,1860,2025,1486,1828,3000,4500,2151,2490,1177.5,3675,4050,2240,2750,3200],
            'historical_low':[16.94,124,188,355,325,645,274,546.5,815,300,610,995,-58.95,740,1505,-150,1265,1410],
          }
          rows=[]
          def unit(item):
            return '$/b' if item=='WTI' else ('$/MT' if item=='WTI_MT' else '$/mt')
          for date,vals in weekly.items():
            for item,price in zip(base_items,vals):
              rows.append({'price_date':date,'week_end':date,'item':item,'benchmark':'','price':price,'unit':unit(item),'price_type':'weekly','source':'260828 위클리 가격표','note':'8/28 위클리 보드 기준'})
          for ym,vals in monthly.items():
            y,m=map(int,ym.split('-')); date=f'{y:04d}-{m:02d}-{calendar.monthrange(y,m)[1]:02d}'
            for item,price in zip(base_items,vals):
              rows.append({'price_date':date,'week_end':date,'item':item,'benchmark':'','price':price,'unit':unit(item),'price_type':'monthly','source':'260828 위클리 가격표','note':f'{ym} 월가격 · 8/28 위클리 보드 기준'})
          specs=[
            ('year_avg_2026','2026-08-31','year_avg','2026년 평균'),
            ('year_avg_2025','2025-12-31','year_avg','2025년 평균'),
            ('year_high_2025','2025-12-30','year_high','2025년 High'),
            ('year_low_2025','2025-12-29','year_low','2025년 Low'),
            ('historical_high','2099-12-31','historical_high','Historical High'),
            ('historical_low','2099-12-30','historical_low','Historical Low'),
          ]
          for key,date,ptype,label in specs:
            for item,price in zip(row_items,stats[key]):
              rows.append({'price_date':date,'week_end':date,'item':item,'benchmark':'','price':price,'unit':unit(item),'price_type':ptype,'source':'260828 위클리 가격표','note':label+' · 8/28 위클리 보드 기준'})
          for i in range(0,len(rows),20):
            data=urllib.parse.urlencode({'action':'saveMarketPrices','token':TOKEN,'data':json.dumps(rows[i:i+20],ensure_ascii=False)}).encode()
            req=urllib.request.Request(GAS,data=data,headers={'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'})
            with urllib.request.urlopen(req,timeout=30) as r:
              out=json.loads(r.read().decode())
              if not out.get('success'): raise SystemExit(out)
          print('seeded',len(rows),'rows')
          PY
      - name: Patch dashboard to prefer explicit DB statistics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="""function matrixYearAverage(item,year,week){
  const d=parseDate(week);if(!d)return null;
  const lastMonth=(year===d.getFullYear())?Math.max(0,d.getMonth()):12; // 현재년도는 직전 완료월까지
  if(lastMonth<1)return null;
  const vals=[];
  for(let m=1;m<=lastMonth;m++){
    const v=matrixMonthAverage(item,year,m);if(v!==null&&Number.isFinite(Number(v)))vals.push(Number(v));
  }
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
"""
          new="""function matrixDirectStatRow(item,type,year=null){
  const rows=ALL_MARKET.filter(r=>r.item===item&&String(r.price_type||'').toLowerCase()===type&&Number.isFinite(Number(r.price))&&
    (year===null||String(r.price_date||'').slice(0,4)===String(year))).sort((a,b)=>String(a.price_date).localeCompare(String(b.price_date)));
  return rows.length?rows.at(-1):null;
}
function matrixYearAverage(item,year,week){
  const d=parseDate(week);if(!d)return null;
  const lastMonth=(year===d.getFullYear())?Math.max(0,d.getMonth()):12; // 현재년도는 직전 완료월까지
  if(lastMonth<1)return null;
  const explicit=matrixDirectStatRow(item,'year_avg',year);
  if(explicit){
    const ed=parseDate(explicit.price_date),baseMonth=ed?ed.getMonth()+1:12,base=Number(explicit.price);
    if(year!==d.getFullYear()||lastMonth<=baseMonth)return base;
    let total=base*baseMonth,count=baseMonth;
    for(let m=baseMonth+1;m<=lastMonth;m++){const v=matrixMonthAverage(item,year,m);if(v!==null&&Number.isFinite(Number(v))){total+=Number(v);count++;}}
    return count?total/count:base;
  }
  const vals=[];
  for(let m=1;m<=lastMonth;m++){const v=matrixMonthAverage(item,year,m);if(v!==null&&Number.isFinite(Number(v)))vals.push(Number(v));}
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
"""
          if old not in s: raise SystemExit('matrixYearAverage target not found')
          s=s.replace(old,new,1)
          old2="""function matrixYearExtreme(item,year,kind){
  const vals=matrixRawHistoryValues(item,year);if(!vals.length)return null;
  return kind==='high'?Math.max(...vals):Math.min(...vals);
}
function matrixHistoricalExtreme(item,kind){
  const vals=matrixRawHistoryValues(item,null);if(!vals.length)return null;
  return kind==='high'?Math.max(...vals):Math.min(...vals);
}
"""
          new2="""function matrixYearExtreme(item,year,kind){
  const direct=matrixDirectStatRow(item,kind==='high'?'year_high':'year_low',year);
  if(direct)return Number(direct.price);
  const vals=matrixRawHistoryValues(item,year);if(!vals.length)return null;
  return kind==='high'?Math.max(...vals):Math.min(...vals);
}
function matrixHistoricalExtreme(item,kind){
  const direct=matrixDirectStatRow(item,kind==='high'?'historical_high':'historical_low',null);
  if(direct)return Number(direct.price);
  const vals=matrixRawHistoryValues(item,null);if(!vals.length)return null;
  return kind==='high'?Math.max(...vals):Math.min(...vals);
}
"""
          if old2 not in s: raise SystemExit('extreme target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit dashboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use W35 board baseline for rolling price matrix"
          git push
