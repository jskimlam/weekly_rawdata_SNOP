name: Fix Page 3 static categories

on:
  push:
    paths:
      - '.github/workflows/page3-static-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix static Page 3 template
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<!-- PAGE 3 -->')
          end = s.find('</section>', start)
          if start < 0 or end < 0:
              raise SystemExit('PAGE 3 not found')
          block = s[start:end]

          # BPA 시황: 유도품 다음에 정기보수 카테고리 추가
          bpa = block.find('<tr><td class="item">BPA</td>')
          mma = block.find('<tr><td class="item">MMA</td>', bpa)
          if bpa < 0 or mma < 0:
              raise SystemExit('BPA/MMA rows not found')
          bpa_row = block[bpa:mma]
          if '[정기보수]' not in bpa_row:
              market_end = bpa_row.find('</td><td class="tone">')
              if market_end < 0:
                  raise SystemExit('BPA market cell end not found')
              ins = '<div class="rowline tagged peer-category"><span class="tag-label">[정기보수]</span><span class="tag-content">중국·대만 주요 설비 정기보수 지속으로 9월 공급 제한</span></div>'
              bpa_row = bpa_row[:market_end] + ins + bpa_row[market_end:]

          # BPA 전망: 기존 [정수] 행 제거, 감산 내용 보강
          old_maint = '<div class="rowline tagged peer-category"><span class="tag-label">[정수]</span><span class="tag-content">주요 업체 정기보수 및 저율가동 지속, 재가동 시점에 따라 공급 회복 여부 확인 필요</span></div>'
          bpa_row = bpa_row.replace(old_maint, '')
          old_red = '<div class="rowline tagged peer-category"><span class="tag-label">[감산]</span><span class="tag-content"></span></div>'
          new_red = '<div class="rowline tagged peer-category"><span class="tag-label">[감산]</span><span class="tag-content">중국 BPA 평균 가동률 약 62.6%, 다수 설비 셧다운과 적자 마진 영향으로 저율가동·감산 압력 지속</span></div>'
          bpa_row = bpa_row.replace(old_red, new_red)

          block = block[:bpa] + bpa_row + block[mma:]
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/page3-static-fix.yml
          git add -A
          git commit -m "Fix Page 3 static BPA category layout"
          git push
